[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microcal"
version = "0.1.0"
description = "Chromatic shift correction for multi-channel fluorescence microscopy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "tifffile",
    "rich",
]

[dependency-groups]
test = ["pytest"]

[project.optional-dependencies]
ndv = ["ndv[vispy]"]
ndv-jup = ["ndv[vispy,jupyter]", "jupyter-rfb<=0.5.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/microcal"]
